<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Preview of the AgencyLaunch Kit template: navy hero headline, an example automation pipeline diagram, and use-case cards on an off-white background">
  <rect width="1200" height="630" fill="#F7F8F5"/>

  <!-- hero band -->
  <rect x="0" y="0" width="1200" height="330" fill="#101827"/>
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="80" y="120" fill="#B7F36B" font-size="15" letter-spacing="3">AI AUTOMATION STUDIO</text>
    <text x="80" y="192" fill="#F7F8F5" font-size="52" font-weight="bold">Automate the repetitive</text>
    <text x="80" y="248" fill="#F7F8F5" font-size="52" font-weight="bold">work behind your business.</text>
    <text x="80" y="292" fill="#AAB6C4" font-size="16">We design, build, and maintain practical automations for the tasks that quietly eat your week.</text>
  </g>
  <rect x="80" y="52" width="16" height="16" rx="4" fill="#B7F36B"/>
  <circle cx="88" cy="60" r="3.4" fill="#101827"/>

  <!-- pipeline diagram motif -->
  <g transform="translate(700 60)">
    <g stroke="rgba(247,248,245,0.07)" stroke-width="1">
      <path d="M0 40h400M0 100h400M0 160h400M0 220h400"/>
      <path d="M80 0v260M160 0v260M240 0v260M320 0v260"/>
    </g>
    <g fill="none" stroke="rgba(247,248,245,0.4)" stroke-width="1.5">
      <path d="M70 60C105 60 108 130 138 130"/>
      <path d="M218 130C248 130 252 52 280 52"/>
      <path d="M218 130C248 130 252 208 280 208"/>
      <path d="M280 208C312 208 316 130 340 130"/>
    </g>
    <path d="M218 130C248 130 252 52 280 52" fill="none" stroke="#B7F36B" stroke-width="1.8" stroke-dasharray="5 6"/>
    <g font-family="Menlo, Consolas, monospace" font-size="11">
      <rect x="18" y="38" width="70" height="44" rx="7" fill="rgba(16,24,39,0.6)" stroke="rgba(247,248,245,0.35)"/>
      <text x="53" y="58" fill="#F7F8F5" text-anchor="middle">Request</text>
      <text x="53" y="72" fill="#AAB6C4" text-anchor="middle" font-size="8.5" letter-spacing="1.5">ARRIVES</text>

      <rect x="138" y="108" width="80" height="44" rx="7" fill="rgba(183,243,107,0.08)" stroke="#B7F36B"/>
      <text x="178" y="128" fill="#F7F8F5" text-anchor="middle">Rules</text>
      <text x="178" y="142" fill="#B7F36B" text-anchor="middle" font-size="8.5" letter-spacing="1.5">QUALIFY</text>

      <rect x="280" y="30" width="80" height="44" rx="7" fill="rgba(183,243,107,0.08)" stroke="#B7F36B"/>
      <text x="320" y="50" fill="#F7F8F5" text-anchor="middle">Reply</text>
      <text x="320" y="64" fill="#B7F36B" text-anchor="middle" font-size="8.5" letter-spacing="1.5">AUTOMATED</text>

      <rect x="280" y="186" width="80" height="44" rx="7" fill="rgba(16,24,39,0.6)" stroke="rgba(247,248,245,0.35)"/>
      <text x="320" y="206" fill="#F7F8F5" text-anchor="middle">Person</text>
      <text x="320" y="220" fill="#AAB6C4" text-anchor="middle" font-size="8.5" letter-spacing="1.5">REVIEWS</text>
    </g>
  </g>

  <!-- light band: example section cards -->
  <g transform="translate(80 380)">
    <text x="0" y="0" fill="#5B6675" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2.5">USE CASES</text>
    <text x="0" y="34" fill="#182230" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold">Four places automation pays off first</text>

    <g transform="translate(0 60)">
      <rect x="0" y="0" width="246" height="150" rx="10" fill="#FFFFFF" stroke="#DCE1D9"/>
      <text x="20" y="32" fill="#182230" font-family="Georgia, serif" font-size="15" font-weight="bold">Lead qualification</text>
      <text x="20" y="54" fill="#5B6675" font-family="Helvetica, Arial, sans-serif" font-size="10.5">Every enquiry gets a consistent first</text>
      <text x="20" y="70" fill="#5B6675" font-family="Helvetica, Arial, sans-serif" font-size="10.5">response and a routed handoff.</text>
      <rect x="20" y="118" width="206" height="1" fill="#DCE1D9"/>
      <text x="20" y="134" fill="#182230" font-family="Helvetica, Arial, sans-serif" font-size="9.5">Example — scored and booked in minutes.</text>

      <rect x="266" y="0" width="246" height="150" rx="10" fill="#FFFFFF" stroke="#DCE1D9"/>
      <text x="286" y="32" fill="#182230" font-family="Georgia, serif" font-size="15" font-weight="bold">Support triage</text>
      <text x="286" y="54" fill="#5B6675" font-family="Helvetica, Arial, sans-serif" font-size="10.5">Tickets classified, tagged, matched to</text>
      <text x="286" y="70" fill="#5B6675" font-family="Helvetica, Arial, sans-serif" font-size="10.5">the right owner or article.</text>
      <rect x="286" y="118" width="206" height="1" fill="#DCE1D9"/>
      <text x="286" y="134" fill="#182230" font-family="Helvetica, Arial, sans-serif" font-size="9.5">Example — status answered from the order system.</text>

      <rect x="532" y="0" width="246" height="150" rx="10" fill="#FFFFFF" stroke="#DCE1D9"/>
      <text x="552" y="32" fill="#182230" font-family="Georgia, serif" font-size="15" font-weight="bold">Repetitive admin</text>
      <text x="552" y="54" fill="#5B6675" font-family="Helvetica, Arial, sans-serif" font-size="10.5">Data entry, file handoffs, and the copy-</text>
      <text x="552" y="70" fill="#5B6675" font-family="Helvetica, Arial, sans-serif" font-size="10.5">paste that lives between tools.</text>
      <rect x="552" y="118" width="206" height="1" fill="#DCE1D9"/>
      <text x="552" y="134" fill="#182230" font-family="Helvetica, Arial, sans-serif" font-size="9.5">Example — weekly report, zero tabs opened.</text>

      <rect x="798" y="0" width="246" height="150" rx="10" fill="#FFFFFF" stroke="#DCE1D9"/>
      <text x="818" y="32" fill="#182230" font-family="Georgia, serif" font-size="15" font-weight="bold">Internal reporting</text>
      <text x="818" y="54" fill="#5B6675" font-family="Helvetica, Arial, sans-serif" font-size="10.5">Operational numbers compiled on a</text>
      <text x="818" y="70" fill="#5B6675" font-family="Helvetica, Arial, sans-serif" font-size="10.5">schedule from tools you already use.</text>
      <rect x="818" y="118" width="206" height="1" fill="#DCE1D9"/>
      <text x="818" y="134" fill="#182230" font-family="Helvetica, Arial, sans-serif" font-size="9.5">Example — Monday digest, generated.</text>
    </g>
  </g>
</svg>
